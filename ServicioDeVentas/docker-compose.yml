version: '3.8'

services:
  postgres-db:
    image: postgres:alpine
    container_name: servicio_ventas_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=my_secret_password
      - POSTGRES_DB=sales_db
    ports:
      - "5432:5432"
    volumes:
      - ../schema/mercadito.ventas.schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

